name: Package Extension

on:
  push:
    branches:
      - master
      - Right-click-translate
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Build & Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, build and package VSIX
        id: build
        # `vsce package` automatically runs the `vscode:prepublish` script,
        # which runs the jest tests and the production webpack build.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VSIX="${NAME}-${VERSION}.vsix"

          npx --yes @vscode/vsce@^3 package --no-dependencies --out "$VSIX"

          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.vsix }}
          path: ${{ steps.build.outputs.vsix }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true
